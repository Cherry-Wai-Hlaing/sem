
name: Java Tests and Docker Build

on:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:
    branches:
      - master
      - main
      - develop

jobs:
  UnitTests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run Unit Tests
        run: mvn -Dtest=com.napier.sem.AppTest test

  IntegrationTests:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build Database Image
        run: docker build -t database ./db

      - name: Start Database
        run: docker run --name employees -d -p 33060:3306 database

      - name: Wait for MySQL
        run: |
          for i in {1..60}; do
            if docker exec employees mysqladmin ping -h 127.0.0.1 -pexample --silent; then
              echo "Database is ready"
              exit 0
            fi
            sleep 2
          done
          docker logs employees
          exit 1

      - name: Run Integration Tests
        run: mvn -Dtest=com.napier.sem.AppIntegrationTest test

      - name: Upload Code Coverage
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/site/jacoco/jacoco.xml
          fail_ci_if_error: false

      - name: Stop Database
        if: always()
        run: docker rm -f employees || true



  Build:
    name: Build Run in Docker and Deploy Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Package and Run docker compose
        run: |
          mvn clean package -DskipTests
          docker compose up --build --abort-on-container-exit

      - name: Copy Output
        run: |
          container_id=$(docker compose ps -aq app)

          if [ -z "$container_id" ]; then
            echo "App container was not found."
            exit 1
          fi

          working_dir=$(docker inspect --format='{{.Config.WorkingDir}}' "$container_id")
          report_path="${working_dir%/}/reports"

          echo "Copying reports from: $report_path"
          docker container cp "$container_id:$report_path" ./reports

      - name: Deploy Reports
        if: github.event_name == 'push'
        uses: JamesIves/github-pages-deploy-action@v4.2.5
        with:
          branch: reports
          folder: reports

      - name: Deploy GitHub Release
        if: github.event_name == 'push'
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false
          automatic_release_tag: "latest"
          files: |
            ./target/*.jar

            

